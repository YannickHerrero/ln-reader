name: Lyra
options:
  bundleIdPrefix: com.yannickherrero
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.11.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "KY6RHJR4LZ"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "2.0"
targets:
  Lyra:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Lyra
    dependencies:
      - package: GRDB
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Lyra/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.lyra
        PRODUCT_NAME: Lyra
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
  LyraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LyraTests
    dependencies:
      - target: Lyra
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.lyra.tests
  LyraUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LyraUITests
    dependencies:
      - target: Lyra
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yannickherrero.lyra.ui-tests
        TEST_TARGET_NAME: Lyra
schemes:
  Lyra:
    build:
      targets:
        Lyra: all
        LyraTests: [test]
        LyraUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - LyraTests
        - LyraUITests
